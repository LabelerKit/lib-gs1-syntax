# GS1 Application Identifier element strings: parsing, validation and the
# GS1 Digital Link URI form.
#
#   gs1-syntax          — the library: AI table, linters, element strings, Digital Link
#   gs1-syntax-iso15223 — device-label short titles (ISO 15223-1 / UDI) on top of it
#   gs1-syntax-gen      — regenerates gs1-syntax's AI table from the vendored dictionary
[workspace]
resolver = "3"
members = [
    "crates/gs1-syntax",
    "crates/gs1-syntax-gen",
    "crates/gs1-syntax-iso15223",
]

# Shared metadata inherited by crates (`field.workspace = true`).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Krystian Duma <krystian@muzik.pl>"]
license = "Apache-2.0"
repository = "https://github.com/LabelerKit/lib-gs1-syntax"
publish = false

[workspace.dependencies]
gs1-syntax = { path = "crates/gs1-syntax" }

# Shared lint policy inherited by every crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
